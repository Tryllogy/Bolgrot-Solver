name: Build executables

# Builds the standalone game (WITH the AI: torch + nets bundled) on Windows,
# Linux and macOS runners. PyInstaller can't cross-compile, so each binary is
# built on its own OS in the cloud — no local Windows/Mac needed. Trigger it:
#   * push a tag like `v0.2.0`  -> builds AND attaches the zips to a Release
#   * "Run workflow" in the Actions tab (workflow_dispatch) -> downloadable
#     artifacts on the run page
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # create the Release and upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: bolgrot-windows
          - os: ubuntu-latest
            asset: bolgrot-linux
          - os: macos-latest
            asset: bolgrot-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps (CPU torch + game + PyInstaller)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch on every OS (the default index would pull multi-GB
          # CUDA on Linux).
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy
          pip install -e ".[build]"

      - name: Build the executable (onedir, AI bundled)
        run: pyinstaller bolgrot.spec --noconfirm --clean

      - name: Smoke-test the AI inside the frozen app
        shell: bash
        run: |
          BIN="dist/bolgrot/bolgrot"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          SDL_VIDEODRIVER=dummy "$BIN" --selftest

      - name: Zip the app folder
        shell: bash
        run: |
          python -c "import shutil; shutil.make_archive('${{ matrix.asset }}', 'zip', 'dist', 'bolgrot')"

      - name: Upload as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

      - name: Attach to the GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}.zip
